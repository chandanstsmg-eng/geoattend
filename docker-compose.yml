# GeoAttend — production-like stack: PostgreSQL + PostGIS, MinIO (private S3 storage),
# Redis (optional; reserved for multi-instance rate limiting), API and admin dashboard.
#
#   cp .env.example .env    # then set real secrets (see docs/DEPLOYMENT.md)
#   docker compose up -d --build
#   docker compose exec api npm run db:seed -w @geoattend/api
#
# Put a TLS-terminating reverse proxy (Caddy, nginx, a cloud load balancer) in front
# of the admin (3400) and API (4400) ports. Never expose 5432 / 9000 publicly.
name: geoattend

# Container logs are rotated, so they cannot fill the disk (Docker keeps them forever by default).
x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: geoattend
      POSTGRES_USER: geoattend
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      # Used once, by docker/db-init, to create the two logins the API connects with.
      PG_OWNER_PASSWORD: ${PG_OWNER_PASSWORD:?set PG_OWNER_PASSWORD in .env}
      PG_TENANT_PASSWORD: ${PG_TENANT_PASSWORD:?set PG_TENANT_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U geoattend -d geoattend']
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - '127.0.0.1:5432:5432'

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    logging: *logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - photos:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'

  # Creates the private bucket once. Anonymous access stays disabled.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY}; do sleep 2; done;
      mc mb --ignore-existing local/$${S3_BUCKET};
      mc anonymous set none local/$${S3_BUCKET};
      "
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-geoattend-photos}

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    profiles: ['redis']

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Named, so the backup job below runs the same image.
    image: geoattend-api:${GEOATTEND_TAG:-local}
    restart: unless-stopped
    logging: *logging
    # SIGTERM: requests in flight get 10 s and the running job finishes its record (apps/api/src/server.ts).
    # Docker's default of 10 s would cut that short.
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      # The API refuses to start with a superuser or with one login for both.
      DATABASE_URL: postgresql://geoattend_owner:${PG_OWNER_PASSWORD}@db:5432/geoattend
      APP_DATABASE_URL: postgresql://geoattend_tenant:${PG_TENANT_PASSWORD}@db:5432/geoattend
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # The address phones and browsers reach the bucket on (through your TLS proxy); links are signed for it.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT in .env}
      S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET: ${S3_BUCKET:-geoattend-photos}
      DEMO_MODE: 'false'
      PAYROLL_ENABLED: 'false'
      PHOTO_AUTO_DELETE_ENABLED: 'false'
      COOKIE_SECURE: 'true'
      PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL in .env}
      DASHBOARD_URL: ${DASHBOARD_URL:?set DASHBOARD_URL in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      # How many proxies sit in front of the API. Everything else in X-Forwarded-For is ignored.
      TRUST_PROXY: ${TRUST_PROXY:?set TRUST_PROXY in .env}
      # The hourly backup check reads the manifests the backup job writes. Without this mount it would look
      # inside the container, find nothing, and warn every hour even when nightly backups are fine.
      BACKUP_DIR: /backups
    volumes:
      - ${BACKUP_HOST_DIR:-./data/backups}:/backups:ro
    ports:
      - '127.0.0.1:4400:4400'

  # Nightly backup (docs/BACKUPS.md): dump, restore check, off-site copy. Never starts with `up`; the
  # systemd timer in deploy/ runs it with `docker compose --profile backup run --rm backup`.
  backup:
    image: geoattend-api:${GEOATTEND_TAG:-local}
    profiles: ['backup']
    depends_on:
      db:
        condition: service_healthy
    # Off-site bucket credentials and the restore-check login (deploy/backup.env.example). chmod 600.
    env_file: ${BACKUP_ENV_FILE:-/etc/geoattend/backup.env}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://geoattend_owner:${PG_OWNER_PASSWORD}@db:5432/geoattend
      PG_BIN: /usr/lib/postgresql/17/bin
      BACKUP_DIR: /backups
    volumes:
      - ${BACKUP_HOST_DIR:-./data/backups}:/backups
    command: ['node', '--import', 'tsx', 'apps/api/scripts/backup-production.ts']

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4400
        PHOTO_ORIGIN: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT in .env}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
    restart: unless-stopped
    logging: *logging
    depends_on: [api]
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:3400:3400'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
        NEXT_PUBLIC_DASHBOARD_URL: ${DASHBOARD_URL:?set DASHBOARD_URL in .env}
        NEXT_PUBLIC_CONTACT_PHONE: ${NEXT_PUBLIC_CONTACT_PHONE:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_CONTACT_WHATSAPP: ${NEXT_PUBLIC_CONTACT_WHATSAPP:-}
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:3500:3500'

volumes:
  pgdata:
  photos:
  redisdata:
